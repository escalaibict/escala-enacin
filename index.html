<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escala de Presença</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #005bbb;
      color: white;
      padding: 1em;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #e9e9e9;
    }

    select {
      width: 100%;
      padding: 5px;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      background-color: #005bbb;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #004599;
    }

    .auth-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      text-align: center;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
    }

    a {
      display: block;
      margin-top: 10px;
      color: #005bbb;
      text-decoration: none;
    }

    .admin-select {
      margin-bottom: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Escala de Presença</h1>
  </header>

  <div id="auth" class="auth-container">
    <h2 id="auth-title">Login</h2>
    <input type="email" id="email" placeholder="E-mail" />
    <input type="password" id="password" placeholder="Senha" />
    <button onclick="login()">Entrar</button>
    <button onclick="register()">Cadastrar</button>
    <a href="#" onclick="toggleAuth()">Já tenho conta / Criar conta</a>
  </div>

  <div id="main" class="container hidden">
    <p><strong>Usuário:</strong> <span id="user-email"></span> | <button onclick="logout()">Sair</button></p>
    
    <div id="admin-area" class="admin-select hidden">
      <label for="userSelect">Selecionar usuário:</label>
      <select id="userSelect" onchange="loadScale()"></select>
    </div>

    <table id="scaleTable">
      <thead>
        <tr>
          <th>Dia</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="scaleBody"></tbody>
    </table>

    <div>
      <button onclick="saveScale()">Salvar</button>
      <button onclick="clearScale()">Limpar</button>
      <button onclick="submitScale()">Enviar</button>
    </div>
  </div>

  <!-- Firebase SDK compatível -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase config (verifique no Firebase console se precisa atualizar)
    const firebaseConfig = {
      apiKey: "AIzaSyCf10Hk-a19hxnUL3TMhBZmHZ34eU2KSqk",
      authDomain: "escalaibict.firebaseapp.com",
      projectId: "escalaibict",
      storageBucket: "escalaibict.appspot.com",
      messagingSenderId: "424701486285",
      appId: "1:424701486285:web:b532902a10f76374f5b584"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let isAdmin = false;
    const statusOptions = ["Presença", "Meio Turno", "Ausência"];

    function toggleAuth() {
      const title = document.getElementById("auth-title");
      title.textContent = title.textContent === "Login" ? "Cadastro" : "Login";
    }

    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      if (!email || !password) {
        alert("Preencha e-mail e senha.");
        return;
      }
      auth.signInWithEmailAndPassword(email, password)
        .then(() => location.reload())
        .catch(e => {
          if (e.code === "auth/invalid-credential") {
            alert("Credenciais inválidas. Verifique e-mail e senha.");
          } else {
            alert("Erro ao entrar: " + e.message);
          }
        });
    }

    function register() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      if (!email || !password) {
        alert("Preencha e-mail e senha.");
        return;
      }
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => location.reload())
        .catch(e => alert("Erro ao cadastrar: " + e.message));
    }

    function logout() {
      auth.signOut().then(() => location.reload());
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById("auth").classList.add("hidden");
        document.getElementById("main").classList.remove("hidden");
        document.getElementById("user-email").textContent = user.email;

        if (user.email === "admin@admin.com") {
          isAdmin = true;
          document.getElementById("admin-area").classList.remove("hidden");
          loadUserList();
        } else {
          generateTable();
        }
      }
    });

    function generateTable(userData = null) {
      const tbody = document.getElementById("scaleBody");
      tbody.innerHTML = "";
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      for (let i = 1; i <= daysInMonth; i++) {
        const date = `${i.toString().padStart(2, "0")}/${(month + 1).toString().padStart(2, "0")}`;
        const tr = document.createElement("tr");
        const tdDate = document.createElement("td");
        tdDate.textContent = date;
        const tdStatus = document.createElement("td");
        const select = document.createElement("select");
        statusOptions.forEach(opt => {
          const option = document.createElement("option");
          option.value = opt;
          option.text = opt;
          select.appendChild(option);
        });
        if (userData && userData[date]) {
          select.value = userData[date];
        }
        tdStatus.appendChild(select);
        tr.appendChild(tdDate);
        tr.appendChild(tdStatus);
        tbody.appendChild(tr);
      }
    }

    function getSelectedUserEmail() {
      return isAdmin ? document.getElementById("userSelect").value : currentUser.email;
    }

    function getScaleData() {
      const rows = document.querySelectorAll("#scaleBody tr");
      const data = {};
      rows.forEach(row => {
        const date = row.cells[0].textContent;
        const status = row.cells[1].querySelector("select").value;
        data[date] = status;
      });
      return data;
    }

    function saveScale() {
      const data = getScaleData();
      const userEmail = getSelectedUserEmail();
      const key = `${new Date().getMonth() + 1}-${new Date().getFullYear()}`;
      db.collection("escalas").doc(userEmail).set({ [key]: data }, { merge: true })
        .then(() => alert("Escala salva com sucesso!"))
        .catch(e => alert("Erro ao salvar: " + e.message));
    }

    function clearScale() {
      document.querySelectorAll("#scaleBody select").forEach(sel => sel.value = "Presença");
    }

    function submitScale() {
      saveScale();
      alert("Escala enviada com sucesso!");
    }

    function loadUserList() {
      db.collection("escalas").get().then(snapshot => {
        const select = document.getElementById("userSelect");
        select.innerHTML = "";
        snapshot.forEach(doc => {
          const option = document.createElement("option");
          option.value = doc.id;
          option.text = doc.id;
          select.appendChild(option);
        });
        loadScale();
      });
    }

    function loadScale() {
      const userEmail = getSelectedUserEmail();
      const key = `${new Date().getMonth() + 1}-${new Date().getFullYear()}`;
      db.collection("escalas").doc(userEmail).get().then(doc => {
        if (doc.exists && doc.data()[key]) {
          generateTable(doc.data()[key]);
        } else {
          generateTable();
        }
      });
    }
  </script>
</body>
</html>
