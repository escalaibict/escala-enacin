<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escala de Presença - ENACIN / IBICT</title>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #0366d6;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    #login-container, #register-container, #reset-container {
      max-width: 400px;
      margin: 50px auto;
      padding: 30px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #0366d6;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #024a9a;
    }
    .link-btn {
      background: none;
      color: #0366d6;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>Escala de Presença - ENACIN / IBICT</header>

  <div id="login-container">
    <h2>Login</h2>
    <input type="email" id="login-email" placeholder="Email">
    <input type="password" id="login-password" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <button class="link-btn" onclick="mostrarCadastro()">Cadastrar</button>
    <button class="link-btn" onclick="mostrarReset()">Esqueci a senha</button>
  </div>

  <div id="register-container" style="display: none;">
    <h2>Cadastro</h2>
    <input type="email" id="register-email" placeholder="Email">
    <input type="password" id="register-password" placeholder="Senha">
    <button onclick="register()">Cadastrar</button>
    <button class="link-btn" onclick="mostrarLogin()">Já tenho conta</button>
  </div>

  <div id="reset-container" style="display: none;">
    <h2>Redefinir Senha</h2>
    <input type="email" id="reset-email" placeholder="Email">
    <button onclick="resetarSenha()">Enviar link de redefinição</button>
    <button class="link-btn" onclick="mostrarLogin()">Lembrei a senha</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_AUTH_DOMAIN",
      projectId: "SEU_PROJECT_ID",
      storageBucket: "SEU_BUCKET",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      auth.signInWithEmailAndPassword(email, password)
        .then(() => alert("Login realizado com sucesso."))
        .catch(error => alert("Erro ao fazer login: " + error.message));
    }

    function register() {
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      auth.createUserWithEmailAndPassword(email, password)
        .then(() => alert("Cadastro realizado com sucesso."))
        .catch(error => alert("Erro ao cadastrar: " + error.message));
    }

    function resetarSenha() {
      const email = document.getElementById('reset-email').value;
      auth.sendPasswordResetEmail(email)
        .then(() => alert("Email de redefinição enviado."))
        .catch(error => alert("Erro ao enviar email: " + error.message));
    }

    function mostrarCadastro() {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('register-container').style.display = 'block';
      document.getElementById('reset-container').style.display = 'none';
    }

    function mostrarLogin() {
      document.getElementById('login-container').style.display = 'block';
      document.getElementById('register-container').style.display = 'none';
      document.getElementById('reset-container').style.display = 'none';
    }

    function mostrarReset() {
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('register-container').style.display = 'none';
      document.getElementById('reset-container').style.display = 'block';
    }
  </script>
</body>
</html>
