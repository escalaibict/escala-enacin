<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Escala de Presença - Enacin/Ibict</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      text-align: center;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #999;
      padding: 6px;
      text-align: center;
    }
    select {
      width: 100%;
    }
    .section {
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <h1>Escala de Presença - Enacin/Ibict</h1>

  <div>
    <label><strong>Funcionário:</strong></label>
    <span id="nomeUsuario">[Nome do usuário]</span>
  </div>

  <div class="section">
    <h2>Mês Atual - Maio 2025</h2>
    <table id="tabelaEscala">
      <thead>
        <tr>
          <th>Dia</th>
          <th>Escala</th>
        </tr>
      </thead>
      <tbody id="corpoTabela">
        <!-- Dias serão gerados pelo JavaScript -->
      </tbody>
    </table>
  </div>

  <div class="section">
    <h2>Viagens</h2>
    <label for="mesViagem">Selecione o mês:</label>
    <select id="mesViagem">
      <option value="2025-01">Janeiro</option>
      <option value="2025-02">Fevereiro</option>
      <option value="2025-03">Março</option>
      <option value="2025-04">Abril</option>
      <option value="2025-05">Maio</option>
      <!-- pode adicionar mais -->
    </select>
    <br/><br/>
    <textarea id="viagemTexto" rows="4" cols="50" placeholder="Descreva as viagens aqui..."></textarea>
  </div>

  <script>
    // Gerar tabela com os dias do mês atual
    const tbody = document.getElementById("corpoTabela");
    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = hoje.getMonth(); // zero-based
    const ultimoDia = new Date(ano, mes + 1, 0).getDate();

    const opcoes = ["", "Presença", "Meio Turno", "Ausência"];

    for (let dia = 1; dia <= ultimoDia; dia++) {
      const tr = document.createElement("tr");

      const tdDia = document.createElement("td");
      tdDia.textContent = dia;
      tr.appendChild(tdDia);

      const tdSelect = document.createElement("td");
      const select = document.createElement("select");
      opcoes.forEach(op => {
        const option = document.createElement("option");
        option.value = op;
        option.text = op;
        select.appendChild(option);
      });
      tdSelect.appendChild(select);
      tr.appendChild(tdSelect);

      tbody.appendChild(tr);
    }
  </script>
</body>
</html>
